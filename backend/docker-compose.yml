version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: oasis-staging-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: oasis_staging
      MYSQL_USER: oasis_user
      MYSQL_PASSWORD: oasis_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - oasis-network

  app:
    image: nginx:alpine
    container_name: oasis-staging-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - mysql
    networks:
      - oasis-network

volumes:
  mysql_data:

networks:
  oasis-network:
    driver: bridge