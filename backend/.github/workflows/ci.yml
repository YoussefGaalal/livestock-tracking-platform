name: CI Pipeline

on:
  push:
    branches: [develop, main, ramy-version]
  pull_request:
    branches: [develop, main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: oasis_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, gd, intl, bcmath, pdo_mysql
          coverage: none
      
      - name: Install Composer dependencies
        run: |
          cd backend
          composer install --no-interaction --prefer-dist --optimize-autoloader
      
      - name: Setup environment
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate
      
      - name: Run migrations
        run: |
          cd backend
          php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: oasis_test
          DB_USERNAME: root
          DB_PASSWORD: rootpassword
      
      - name: Run PHPUnit tests
        run: |
          cd backend
          php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: oasis_test
          DB_USERNAME: root
          DB_PASSWORD: rootpassword

  frontend-lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd backend
          npm install
      
      - name: Run ESLint
        run: |
          cd backend
          npm run lint || true
      
      - name: Run Vitest tests
        run: |
          cd backend
          npm run test || true

  mobile-tests:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
      
      - name: Install Flutter dependencies
        run: |
          cd mobile
          flutter pub get
      
      - name: Run Flutter analyzer
        run: |
          cd mobile
          flutter analyze
      
      - name: Run Flutter tests
        run: |
          cd mobile
          flutter test || true
