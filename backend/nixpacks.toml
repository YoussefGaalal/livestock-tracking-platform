[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo_mysql", "php84Extensions.mbstring", "php84Extensions.xml", "php84Extensions.curl", "php84Extensions.zip", "php84Extensions.gd", "php84Extensions.intl", "php84Extensions.bcmath", "nodejs_20", "nodePackages.npm"]

[phases.install]
cmds = [
  "rm -f bootstrap/cache/*.php",
  "composer install --no-dev",
  "npm install",
  "npm run build"
]

[start]
cmd = "php artisan optimize:clear && php artisan package:discover --ansi && php artisan migrate --force && php artisan db:seed --class=SubscriptionTierSeeder --force && php artisan db:seed --class=RoleSeeder --force && php artisan db:seed --class=UserSeeder --force && php -S 0.0.0.0:$PORT -t public"
